<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="Anis Mselmi — Linux terminal">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Per-line typewriter reveals: each rect grows left→right during its window,
         then all snap back to 0 at loop restart so the terminal re-types itself.
         Widths are sized past each line's text so no characters get clipped. -->
    <clipPath id="clip1"><rect x="30" y="76"  height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.16;1" values="0;0;317;317"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="30" y="104" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.16;0.29;1" values="0;0;401;401"/>
    </rect></clipPath>
    <clipPath id="clip3"><rect x="30" y="144" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.29;0.42;1" values="0;0;307;307"/>
    </rect></clipPath>
    <clipPath id="clip4"><rect x="30" y="172" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.42;0.54;1" values="0;0;317;317"/>
    </rect></clipPath>
    <clipPath id="clip5"><rect x="30" y="212" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.54;0.65;1" values="0;0;307;307"/>
    </rect></clipPath>
    <clipPath id="clip6"><rect x="30" y="240" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.65;0.75;1" values="0;0;242;242"/>
    </rect></clipPath>
    <!-- Final resting prompt only appears after the last line is typed -->
    <clipPath id="clip7"><rect x="30" y="280" height="26" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.73;0.76;1" values="0;0;190;190"/>
    </rect></clipPath>
  </defs>

  <!-- transparent canvas: blends with any README theme -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="800" height="320" rx="12" fill="#0d1117" stroke="#262c36" stroke-width="1.2"/>
  </g>

  <!-- Title bar -->
  <path d="M10 22 a12 12 0 0 1 12 -12 h776 a12 12 0 0 1 12 12 v26 h-800 z" fill="#161b22"/>
  <line x1="10" y1="48" x2="810" y2="48" stroke="#262c36" stroke-width="1"/>
  <g transform="translate(34,29)">
    <circle cx="0"  cy="0" r="6" fill="#ff5f56"/>
    <circle cx="20" cy="0" r="6" fill="#ffbd2e"/>
    <circle cx="40" cy="0" r="6" fill="#27c93f"/>
  </g>
  <text x="410" y="33" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono','DejaVu Sans Mono',monospace" font-size="12.5" fill="#7d8590">
    <tspan fill="#adbac7" font-weight="600">anis@mselmi</tspan>: ~ — bash
  </text>

  <!-- Session: each line is clipped by its animated reveal rect -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono','DejaVu Sans Mono','Courier New',monospace" font-size="15.5" xml:space="preserve">

    <g clip-path="url(#clip1)">
      <text x="36" y="94"><tspan fill="#3fb950" font-weight="700">anis@mselmi</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#e6edf3">$</tspan> <tspan fill="#79c0ff">cat</tspan> <tspan fill="#adbac7">whoami.txt</tspan></text>
    </g>
    <g clip-path="url(#clip2)">
      <text x="36" y="122"><tspan fill="#e6edf3" font-weight="600">Anis Mselmi</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#adbac7">Data Engineering Student</tspan></text>
    </g>

    <g clip-path="url(#clip3)">
      <text x="36" y="162"><tspan fill="#3fb950" font-weight="700">anis@mselmi</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#e6edf3">$</tspan> <tspan fill="#79c0ff">cat</tspan> <tspan fill="#adbac7">focus.txt</tspan></text>
    </g>
    <g clip-path="url(#clip4)">
      <text x="36" y="190"><tspan fill="#3fb950">LLMs</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#58a6ff">RAG</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#bc8cff">Machine Learning</tspan></text>
    </g>

    <g clip-path="url(#clip5)">
      <text x="36" y="230"><tspan fill="#3fb950" font-weight="700">anis@mselmi</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#e6edf3">$</tspan> <tspan fill="#79c0ff">echo</tspan> <tspan fill="#d2a8ff">$WEBSITE</tspan></text>
    </g>
    <g clip-path="url(#clip6)">
      <text x="36" y="258"><tspan fill="#58a6ff" text-decoration="underline">https://anismselmi.me</tspan></text>
    </g>

    <!-- Final resting prompt (revealed only at the end, hidden on loop restart) -->
    <g clip-path="url(#clip7)">
      <text x="36" y="298"><tspan fill="#3fb950" font-weight="700">anis@mselmi</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#e6edf3">$</tspan> </text>
    </g>

    <!-- Cursor: rides the typing front line-by-line, then rests + blinks -->
    <rect width="10" height="17" fill="#3fb950">
      <animate attributeName="x" dur="10s" repeatCount="indefinite"
        keyTimes="0;0.03;0.16;0.16;0.29;0.29;0.42;0.42;0.54;0.54;0.65;0.65;0.75;0.75;1"
        values="40;40;347;40;431;40;337;40;347;40;337;40;272;178;178"/>
      <animate attributeName="y" dur="10s" repeatCount="indefinite"
        keyTimes="0;0.03;0.16;0.16;0.29;0.29;0.42;0.42;0.54;0.54;0.65;0.65;0.75;0.75;1"
        values="80;80;80;108;108;148;148;176;176;216;216;244;244;284;284"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        keyTimes="0;0.75;0.80;0.85;0.90;0.95;1" values="1;1;0;1;0;1;1"/>
    </rect>
  </g>
</svg>
